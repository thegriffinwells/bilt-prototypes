<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilt — Icon Modifier</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Hidden SVG filter definitions -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <!-- Embossed 3D / Molded Plastic — subtle monochromatic inner shadow bevel -->
      <filter id="embossed" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <!-- Base: fill icon shape with the same color as bg -->
        <feFlood id="emb-color" flood-color="#88BB88" flood-opacity="1" result="baseFill"/>
        <feComposite in="baseFill" in2="SourceAlpha" operator="in" result="colorShape"/>

        <!-- Inner shadow (dark, bottom-right edge) — tight, not blurry -->
        <feOffset id="emb-shadow-offset" in="SourceAlpha" dx="0.25" dy="0.25" result="shadowOffset"/>
        <feGaussianBlur id="emb-shadow-blur" in="shadowOffset" stdDeviation="0.25" result="shadowBlur"/>
        <feComposite in="shadowBlur" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="innerShadow"/>
        <feFlood id="emb-shadow-color" flood-color="#000000" flood-opacity="0.2" result="shadowColor"/>
        <feComposite in="shadowColor" in2="innerShadow" operator="in" result="darkShadow"/>

        <!-- Inner highlight (light, top-left edge) — tight, subtle -->
        <feOffset id="emb-light-offset" in="SourceAlpha" dx="-0.25" dy="-0.25" result="lightOffset"/>
        <feGaussianBlur id="emb-light-blur" in="lightOffset" stdDeviation="0.25" result="lightBlur"/>
        <feComposite in="lightBlur" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="innerLight"/>
        <feFlood id="emb-highlight-color" flood-color="#ffffff" flood-opacity="0.25" result="lightColor"/>
        <feComposite in="lightColor" in2="innerLight" operator="in" result="brightHighlight"/>

        <!-- Merge: base color → dark inner shadow → light inner highlight (no outer glow) -->
        <feMerge>
          <feMergeNode in="colorShape"/>
          <feMergeNode in="darkShadow"/>
          <feMergeNode in="brightHighlight"/>
        </feMerge>
      </filter>

      <!-- Watercolor Painting — paper grain texture on strokes/fills -->
      <filter id="watercolor" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
        <!-- Step 1: Fine paper grain → convert to alpha mask -->
        <feTurbulence id="wc-paper" type="fractalNoise" baseFrequency="4" numOctaves="5" seed="15" result="grain"/>
        <feColorMatrix in="grain" type="luminanceToAlpha" result="grainAlpha"/>
        <feComponentTransfer in="grainAlpha" result="grainMask">
          <feFuncA type="table" tableValues="0.5 0.72 0.88 0.6 0.95 0.7 0.82 0.55 0.9 0.68"/>
        </feComponentTransfer>

        <!-- Step 2: Multiply icon alpha by grain mask — speckle the strokes -->
        <feComposite in="SourceGraphic" in2="grainMask" operator="in" result="texturedIcon"/>

        <!-- Step 3: Slight edge distortion for organic feel -->
        <feTurbulence id="wc-edge-noise" type="turbulence" baseFrequency="0.04" numOctaves="3" seed="2" result="edgeNoise"/>
        <feDisplacementMap id="wc-displace" in="texturedIcon" in2="edgeNoise" scale="0.3" xChannelSelector="R" yChannelSelector="G"/>
      </filter>

      <!-- Metallic / Polished Chrome — smooth 3D silver with soft gradients -->
      <filter id="metallic" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="linearRGB">
        <!-- Step 1: Smooth surface for lighting (higher blur = smoother) -->
        <feGaussianBlur id="met-blur" in="SourceAlpha" stdDeviation="1.0" result="surfaceBlur"/>

        <!-- Step 2: Diffuse lighting — smooth gradient across body -->
        <feDiffuseLighting id="met-diffuse" in="surfaceBlur" surfaceScale="4" diffuseConstant="1.0" lighting-color="#ffffff" result="diffuse">
          <feDistantLight id="met-distant-light" azimuth="315" elevation="50"/>
        </feDiffuseLighting>
        <feComposite in="diffuse" in2="SourceAlpha" operator="in" result="diffClipped"/>

        <!-- Step 3: Specular highlight — tight sheen on edges -->
        <feSpecularLighting id="met-specular" in="surfaceBlur" surfaceScale="3" specularConstant="0.8" specularExponent="35" lighting-color="#ffffff" result="specular">
          <feDistantLight azimuth="315" elevation="60"/>
        </feSpecularLighting>
        <feComposite in="specular" in2="SourceAlpha" operator="in" result="specClipped"/>

        <!-- Step 4: Silver base fill -->
        <feFlood id="met-base-color" flood-color="#B0B0B4" flood-opacity="1" result="silverFill"/>
        <feComposite in="silverFill" in2="SourceAlpha" operator="in" result="silverShape"/>

        <!-- Step 5: Soft drop shadow -->
        <feOffset id="met-shadow-offset" in="SourceAlpha" dx="0.3" dy="0.5" result="shadowOff"/>
        <feGaussianBlur id="met-shadow-blur" in="shadowOff" stdDeviation="0.7" result="shadowBlur"/>
        <feFlood id="met-shadow-color" flood-color="#000000" flood-opacity="0.35" result="shadowFill"/>
        <feComposite in="shadowFill" in2="shadowBlur" operator="in" result="dropShadow"/>

        <!-- Step 6: Bevel — inner highlight on top-left edge -->
        <feOffset id="met-bevel-light-off" in="SourceAlpha" dx="-0.2" dy="-0.2" result="bevelLightOff"/>
        <feGaussianBlur id="met-bevel-blur" in="bevelLightOff" stdDeviation="0.3" result="bevelBlur"/>
        <feComposite in="bevelBlur" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="bevelEdge"/>
        <feFlood flood-color="#ffffff" flood-opacity="0.6" result="bevelColor"/>
        <feComposite in="bevelColor" in2="bevelEdge" operator="in" result="bevelHighlight"/>

        <!-- Step 7: Bevel — inner shadow on bottom-right edge -->
        <feOffset id="met-bevel-dark-off" in="SourceAlpha" dx="0.2" dy="0.2" result="bevelDarkOff"/>
        <feGaussianBlur in="bevelDarkOff" stdDeviation="0.3" result="bevelDarkBlur"/>
        <feComposite in="bevelDarkBlur" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="bevelDarkEdge"/>
        <feFlood flood-color="#000000" flood-opacity="0.4" result="bevelDarkColor"/>
        <feComposite in="bevelDarkColor" in2="bevelDarkEdge" operator="in" result="bevelShadow"/>

        <!-- Step 8: Merge — shadow → silver → diffuse → bevel shadow → bevel highlight → specular -->
        <feMerge>
          <feMergeNode in="dropShadow"/>
          <feMergeNode in="silverShape"/>
          <feMergeNode in="diffClipped"/>
          <feMergeNode in="bevelShadow"/>
          <feMergeNode in="bevelHighlight"/>
          <feMergeNode in="specClipped"/>
        </feMerge>
      </filter>

      <!-- Leather / Skeuomorphic — rich tooled leather with grain, lighting, stitching -->
      <filter id="leather" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
        <!-- Step 1: Leather pore grain -->
        <feTurbulence id="lth-grain" type="fractalNoise" baseFrequency="2.5" numOctaves="5" seed="8" result="grain"/>
        <feColorMatrix in="grain" type="saturate" values="0" result="grainGray"/>
        <!-- Remap grain to subtle range -->
        <feComponentTransfer in="grainGray" result="grainSubtle">
          <feFuncR type="linear" slope="0.15" intercept="0.42"/>
          <feFuncG type="linear" slope="0.15" intercept="0.42"/>
          <feFuncB type="linear" slope="0.15" intercept="0.42"/>
        </feComponentTransfer>

        <!-- Step 2: Rich leather base color -->
        <feFlood id="lth-base-color" flood-color="#8B5A2B" flood-opacity="1" result="leatherFill"/>
        <feComposite in="leatherFill" in2="SourceAlpha" operator="in" result="leatherShape"/>

        <!-- Step 3: Blend grain into leather (soft-light for subtle pores) -->
        <feComposite in="grainSubtle" in2="SourceAlpha" operator="in" result="grainClipped"/>
        <feBlend in="leatherShape" in2="grainClipped" mode="soft-light" result="texturedLeather"/>

        <!-- Step 4: Surface map for lighting -->
        <feGaussianBlur id="lth-surface-blur" in="SourceAlpha" stdDeviation="0.9" result="surfaceBlur"/>

        <!-- Step 5: Warm diffuse lighting — soft-light blend preserves leather color -->
        <feDiffuseLighting id="lth-diffuse" in="surfaceBlur" surfaceScale="3.5" diffuseConstant="0.9" lighting-color="#FFEACC" result="diffuse">
          <feDistantLight id="lth-distant-light" azimuth="315" elevation="50"/>
        </feDiffuseLighting>
        <feComposite in="diffuse" in2="SourceAlpha" operator="in" result="diffClipped"/>
        <feBlend in="texturedLeather" in2="diffClipped" mode="soft-light" result="litLeather"/>

        <!-- Step 6: Matte specular — very subtle warm sheen -->
        <feSpecularLighting id="lth-specular" in="surfaceBlur" surfaceScale="2" specularConstant="0.12" specularExponent="8" lighting-color="#FFE0B2" result="specular">
          <feDistantLight azimuth="315" elevation="55"/>
        </feSpecularLighting>
        <feComposite in="specular" in2="SourceAlpha" operator="in" result="specClipped"/>

        <!-- Step 7: Inner bevel — tooled edge highlight -->
        <feOffset id="lth-bevel-light-off" in="SourceAlpha" dx="-0.18" dy="-0.18" result="bevelLightOff"/>
        <feGaussianBlur id="lth-bevel-blur" in="bevelLightOff" stdDeviation="0.2" result="bevelBlur"/>
        <feComposite in="bevelBlur" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="bevelEdge"/>
        <feFlood flood-color="#D4A870" flood-opacity="0.5" result="bevelColor"/>
        <feComposite in="bevelColor" in2="bevelEdge" operator="in" result="bevelHighlight"/>

        <!-- Step 8: Inner bevel shadow -->
        <feOffset id="lth-bevel-dark-off" in="SourceAlpha" dx="0.18" dy="0.18" result="bevelDarkOff"/>
        <feGaussianBlur in="bevelDarkOff" stdDeviation="0.2" result="bevelDarkBlur"/>
        <feComposite in="bevelDarkBlur" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="bevelDarkEdge"/>
        <feFlood flood-color="#2A1508" flood-opacity="0.55" result="bevelDarkColor"/>
        <feComposite in="bevelDarkColor" in2="bevelDarkEdge" operator="in" result="bevelShadow"/>

        <!-- Step 9: Drop shadow -->
        <feOffset id="lth-shadow-offset" in="SourceAlpha" dx="0.25" dy="0.4" result="shadowOff"/>
        <feGaussianBlur id="lth-shadow-blur" in="shadowOff" stdDeviation="0.6" result="shadowBlur"/>
        <feFlood id="lth-shadow-color" flood-color="#1A0E05" flood-opacity="0.4" result="shadowFill"/>
        <feComposite in="shadowFill" in2="shadowBlur" operator="in" result="dropShadow"/>

        <!-- Step 10: Merge -->
        <feMerge>
          <feMergeNode in="dropShadow"/>
          <feMergeNode in="litLeather"/>
          <feMergeNode in="bevelShadow"/>
          <feMergeNode in="bevelHighlight"/>
          <feMergeNode in="specClipped"/>
        </feMerge>
      </filter>

      <!-- Crystal / Swarovski — faceted refractive crystal -->
      <filter id="crystal" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">

        <!-- ═══ BODY: Rich blue base with internal facet structure ═══ -->

        <!-- Medium blue fill -->
        <feFlood flood-color="#6DAFD8" flood-opacity="1" result="midBlue"/>
        <feComposite in="midBlue" in2="SourceAlpha" operator="in" result="blueBase"/>

        <!-- Large-scale facet pattern (angular light/dark regions) -->
        <feTurbulence id="cry-facets" type="turbulence" baseFrequency="0.09" numOctaves="2" seed="5" result="facet1"/>
        <feColorMatrix in="facet1" type="luminanceToAlpha" result="facet1Lum"/>
        <feComponentTransfer in="facet1Lum" result="facet1Steps">
          <feFuncA type="discrete" tableValues="0.0 0.25 0.5 0.75 1.0"/>
        </feComponentTransfer>

        <!-- Deep blue for dark facet regions -->
        <feFlood flood-color="#2E6B95" result="deepBlue"/>
        <feComposite in="deepBlue" in2="facet1Steps" operator="in" result="darkFacets"/>
        <feComposite in="darkFacets" in2="SourceAlpha" operator="in" result="darkInShape"/>

        <!-- Small-scale facet detail (finer angular cuts) -->
        <feTurbulence type="turbulence" baseFrequency="0.18" numOctaves="2" seed="11" result="facet2"/>
        <feColorMatrix in="facet2" type="luminanceToAlpha" result="facet2Lum"/>
        <feComponentTransfer in="facet2Lum" result="facet2Steps">
          <feFuncA type="discrete" tableValues="0.0 0.15 0.4 0.7 1.0"/>
        </feComponentTransfer>

        <!-- Light blue/white for bright facet regions -->
        <feFlood flood-color="#B8DDEF" result="lightBlue"/>
        <feComposite in="lightBlue" in2="facet2Steps" operator="in" result="lightFacets"/>
        <feComposite in="lightFacets" in2="SourceAlpha" operator="in" result="lightInShape"/>

        <!-- Compose crystal body: base + dark facets (overlay) + light facets (screen) -->
        <feBlend in="blueBase" in2="darkInShape" mode="multiply" result="bodyDark"/>
        <feBlend in="bodyDark" in2="lightInShape" mode="screen" result="crystalBody"/>

        <!-- Boost saturation and brightness -->
        <feComponentTransfer in="crystalBody" result="crystalVivid">
          <feFuncR type="linear" slope="0.85" intercept="0.12"/>
          <feFuncG type="linear" slope="0.8" intercept="0.2"/>
          <feFuncB type="linear" slope="0.65" intercept="0.35"/>
        </feComponentTransfer>

        <!-- ═══ LIGHTING: Multiple specular sources for sparkle ═══ -->

        <!-- Smooth surface for edge-based specular -->
        <feGaussianBlur id="cry-blur" in="SourceAlpha" stdDeviation="0.5" result="smoothSurface"/>

        <!-- Primary specular: top-left, sharp highlight on edges -->
        <feSpecularLighting id="cry-specular" in="smoothSurface" surfaceScale="5" specularConstant="1.5" specularExponent="65" lighting-color="#ffffff" result="spec1">
          <feDistantLight id="cry-spec-light" azimuth="315" elevation="55"/>
        </feSpecularLighting>
        <feComposite in="spec1" in2="SourceAlpha" operator="in" result="spec1Clip"/>

        <!-- Secondary specular: opposite side, softer -->
        <feSpecularLighting id="cry-specular2" in="smoothSurface" surfaceScale="3" specularConstant="0.6" specularExponent="35" lighting-color="#D0E8FF" result="spec2">
          <feDistantLight azimuth="135" elevation="40"/>
        </feSpecularLighting>
        <feComposite in="spec2" in2="SourceAlpha" operator="in" result="spec2Clip"/>

        <!-- Third specular: top, for extra catch-light -->
        <feSpecularLighting in="smoothSurface" surfaceScale="3.5" specularConstant="0.5" specularExponent="50" lighting-color="#ffffff" result="spec3">
          <feDistantLight azimuth="0" elevation="65"/>
        </feSpecularLighting>
        <feComposite in="spec3" in2="SourceAlpha" operator="in" result="spec3Clip"/>

        <!-- Internal sparkle points: specular on faceted turbulence surface -->
        <feGaussianBlur in="facet1Lum" stdDeviation="0.15" result="facetSurface"/>
        <feSpecularLighting in="facetSurface" surfaceScale="3" specularConstant="0.8" specularExponent="80" lighting-color="#ffffff" result="sparkle">
          <feDistantLight azimuth="315" elevation="50"/>
        </feSpecularLighting>
        <feComposite in="sparkle" in2="SourceAlpha" operator="in" result="sparkleClip"/>

        <!-- ═══ EDGES: Crisp bevel for faceted cut edges ═══ -->

        <!-- Bright edge catch-light -->
        <feOffset id="cry-bevel-light" in="SourceAlpha" dx="-0.12" dy="-0.12" result="bvlLtOff"/>
        <feGaussianBlur id="cry-bevel-blur" in="bvlLtOff" stdDeviation="0.08" result="bvlLtBlur"/>
        <feComposite in="bvlLtBlur" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="bvlLtEdge"/>
        <feFlood flood-color="#ffffff" flood-opacity="0.9" result="bvlLtColor"/>
        <feComposite in="bvlLtColor" in2="bvlLtEdge" operator="in" result="bevelHi"/>

        <!-- Dark edge shadow -->
        <feOffset in="SourceAlpha" dx="0.12" dy="0.12" result="bvlDkOff"/>
        <feGaussianBlur in="bvlDkOff" stdDeviation="0.08" result="bvlDkBlur"/>
        <feComposite in="bvlDkBlur" in2="SourceAlpha" operator="arithmetic" k1="0" k2="1" k3="-1" k4="0" result="bvlDkEdge"/>
        <feFlood flood-color="#1A4060" flood-opacity="0.5" result="bvlDkColor"/>
        <feComposite in="bvlDkColor" in2="bvlDkEdge" operator="in" result="bevelLo"/>

        <!-- ═══ SHADOW ═══ -->
        <feOffset id="cry-shadow-offset" in="SourceAlpha" dx="0.3" dy="0.5" result="shOff"/>
        <feGaussianBlur id="cry-shadow-blur" in="shOff" stdDeviation="0.7" result="shBlur"/>
        <feFlood id="cry-shadow-color" flood-color="#1A3050" flood-opacity="0.25" result="shFill"/>
        <feComposite in="shFill" in2="shBlur" operator="in" result="dropShadow"/>

        <!-- ═══ FINAL COMPOSITE ═══ -->
        <feMerge>
          <feMergeNode in="dropShadow"/>
          <feMergeNode in="crystalVivid"/>
          <feMergeNode in="bevelLo"/>
          <feMergeNode in="bevelHi"/>
          <feMergeNode in="sparkleClip"/>
          <feMergeNode in="spec3Clip"/>
          <feMergeNode in="spec2Clip"/>
          <feMergeNode in="spec1Clip"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <div class="app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Icon Modifier</h1>
        <p class="subtitle">Bilt Design Tools</p>
      </div>

      <!-- Icon Picker -->
      <div class="panel">
        <label class="panel-label">Icons</label>
        <input type="text" id="icon-search" class="search-input" placeholder="Search icons...">
        <div id="icon-grid" class="icon-grid"></div>
      </div>

      <!-- Style Presets -->
      <div class="panel">
        <label class="panel-label">Style</label>
        <div class="segmented-control" id="style-control">
          <button class="seg-btn" data-style="plain">Plain</button>
          <button class="seg-btn" data-style="embossed">Embossed</button>
          <button class="seg-btn active" data-style="watercolor">Watercolor</button>
          <button class="seg-btn" data-style="metallic">Metallic</button>
          <button class="seg-btn" data-style="leather">Leather</button>
          <button class="seg-btn" data-style="crystal">Crystal</button>
        </div>
      </div>

      <!-- Color -->
      <div class="panel">
        <label class="panel-label">Color</label>
        <div class="color-row">
          <input type="color" id="color-picker" value="#0C0C0C" class="color-input">
          <div class="swatches" id="swatches"></div>
        </div>
      </div>

      <!-- Effect Controls (contextual) -->
      <div class="panel" id="effect-controls">
        <label class="panel-label">Effect</label>
        <div class="slider-group">
          <label class="slider-label">Intensity <span id="intensity-val">50</span></label>
          <input type="range" id="intensity" min="0" max="100" value="50" class="slider">
        </div>
        <div class="slider-group" id="glossiness-group">
          <label class="slider-label">Glossiness <span id="glossiness-val">50</span></label>
          <input type="range" id="glossiness" min="0" max="100" value="50" class="slider">
        </div>
        <div class="slider-group" id="softness-group" style="display:none">
          <label class="slider-label">Softness <span id="softness-val">50</span></label>
          <input type="range" id="softness" min="0" max="100" value="50" class="slider">
        </div>
        <div class="slider-group" id="texture-group" style="display:none">
          <label class="slider-label">Texture <span id="texture-val">30</span></label>
          <input type="range" id="texture" min="0" max="100" value="30" class="slider">
        </div>
        <div class="slider-group" id="relief-group" style="display:none">
          <label class="slider-label">Relief <span id="relief-val">50</span></label>
          <input type="range" id="relief" min="0" max="100" value="50" class="slider">
        </div>
        <div class="slider-group" id="bevel-group" style="display:none">
          <label class="slider-label">Bevel <span id="bevel-val">50</span></label>
          <input type="range" id="bevel" min="0" max="100" value="50" class="slider">
        </div>
        <div class="slider-group" id="shadow-group" style="display:none">
          <label class="slider-label">Shadow <span id="shadow-val">40</span></label>
          <input type="range" id="shadow" min="0" max="100" value="40" class="slider">
        </div>
        <div id="seed-row" style="display:none">
          <button id="randomize-btn" class="btn btn-small">Randomize</button>
        </div>
      </div>

      <!-- Size -->
      <div class="panel">
        <label class="panel-label">Size <span id="size-val">256</span>px</label>
        <input type="range" id="size" min="64" max="512" value="256" class="slider">
      </div>

      <!-- Background -->
      <div class="panel">
        <label class="panel-label">Background</label>
        <div class="segmented-control" id="bg-control">
          <button class="seg-btn active" data-bg="light">Light</button>
          <button class="seg-btn" data-bg="dark">Dark</button>
          <button class="seg-btn" data-bg="transparent">Grid</button>
        </div>
      </div>

      <!-- Export -->
      <div class="panel">
        <div class="export-row">
          <button id="copy-svg" class="btn">Copy SVG</button>
          <button id="copy-png" class="btn">Copy PNG</button>
        </div>
        <div class="export-row">
          <button id="export-svg" class="btn btn-primary">Download SVG</button>
          <button id="export-png" class="btn btn-primary">Download PNG</button>
        </div>
      </div>
    </aside>

    <!-- Viewer -->
    <main class="viewer bg-light" id="viewer">
      <div class="viewer-canvas" id="viewer-canvas">
        <svg id="preview-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="256" height="256">
          <g id="preview-group">
            <text x="12" y="14" text-anchor="middle" font-size="4" fill="#555">Select an icon</text>
          </g>
        </svg>
      </div>
      <div class="viewer-info" id="viewer-info"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
